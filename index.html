<style>
:root{
  --gold:#D4AF37;
  --text:#F8F6E2;
  --bg:#020814;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#020814;
  color:var(--text);
  font-family:"Noto Serif TC","Times New Roman",serif;
  overflow-x:hidden;
}

button{
  font-family:inherit;
}

.page{
  display:none;
  min-height:100vh;
  position:relative;
  background:#020814 center top/cover no-repeat;
}

.page.active{
  display:block;
}

.screen{
  width:min(100vw,820px);
  min-height:100vh;
  margin:0 auto;
  position:relative;
  background-position:center top;
  background-size:100% auto;
  background-repeat:no-repeat;
}

.screen::before{
  content:"";
  display:block;
  width:100%;
  padding-top:133.3333%;
}

.hotspot{
  position:absolute;
  border:0;
  background:rgba(255,255,255,0);
  cursor:pointer;
  border-radius:18px;
}

.hotspot:active{
  background:rgba(212,175,55,.12);
}

.hidden-label{
  position:absolute;
  left:-9999px;
}

.draw-title{

.draw-count{

.deck-area{

  right:7%;

  bottom:18%;

  flex-wrap:wrap;
  gap:8px;
  align-content:center;
  justify-content:center;
  overflow:auto;
  padding:10px;
}

.deck-card{
  width:52px;
  height:84px;
  border:1px solid rgba(212,175,55,.85);
  border-radius:9px;
  background:
    radial-gradient(circle at 50% 40%,rgba(245,211,122,.16),transparent 20%),
    repeating-radial-gradient(circle at 50% 50%,rgba(212,175,55,.18) 0 1px,transparent 1px 14px),
    linear-gradient(180deg,#081326,#040914);
  box-shadow:0 0 12px rgba(212,175,55,.18);
  position:relative;
  cursor:pointer;
  flex:0 0 auto;
}

.deck-card::before{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(212,175,55,.48);
  border-radius:6px;
}

.deck-card::after{
  content:"☾";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#F5D37A;
  font-size:24px;
  text-shadow:0 0 10px rgba(212,175,55,.5);
}

.deck-card.selected{
  transform:translateY(-8px);
  box-shadow:0 0 20px rgba(245,211,122,.65);
}

.deck-card.disabled{
  opacity:.35;
  pointer-events:none;
}

.result-overlay{
  position:absolute;
  left:10%;
  right:10%;
  top:25%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px 34px;
  justify-items:center;
}

.result-card{
  text-align:center;
  color:#F5D37A;
}

.result-pos{
  font-size:clamp(16px,3.5vw,30px);
  letter-spacing:.12em;
  margin-bottom:8px;
  font-weight:700;
}

.result-sub{
  color:#F8F6E2;
  font-size:clamp(11px,2.3vw,17px);
  margin-top:-4px;
  margin-bottom:8px;
}

.result-card img{
  width:min(21vw,145px);
  height:auto;
  aspect-ratio:.58;
  object-fit:cover;
  border:3px solid rgba(212,175,55,.92);
  border-radius:8px;
  background:#111;
  box-shadow:0 0 18px rgba(212,175,55,.3);
}

.result-card img.reversed{
  transform:rotate(180deg);
}

.result-name{
  font-size:clamp(13px,2.8vw,22px);
  margin-top:7px;
  letter-spacing:.06em;

.result-actions{

  right:14%;
  top:84%;

  gap:28px;
  justify-content:center;

.action-btn{
  flex:1;

  border-radius:999px;

  font-size:clamp(14px,3.2vw,24px);

  background:linear-gradient(180deg,#fff0bd,#D4AF37,#9B6A22);

.action-btn.dark{

  background:rgba(2,8,20,.78);

<body>

<section class="page active" id="home">
  <div class="screen">
    <button class="hotspot home-start" onclick="goPage('spread')">
      <span class="hidden-label">開始抽牌</span>
    </button>
    <button class="hotspot home-nav-tarot" onclick="goPage('spread')"></button>
    <button class="hotspot home-nav-oracle" onclick="goPage('oracle')"></button>
    <button class="hotspot home-nav-history" onclick="goPage('history')"></button>
    <button class="hotspot home-nav-setting" onclick="goPage('settings')"></button>
  </div>
</section>

<section class="page" id="spread">
  <div class="screen">
    <button class="hotspot spread-triangle" onclick="chooseSpread('triangle')"></button>
    <button class="hotspot spread-time" onclick="chooseSpread('time')"></button>
    <button class="hotspot spread-decision" onclick="chooseSpread('decision')"></button>
    <button class="hotspot spread-spirit" onclick="chooseSpread('spirit')"></button>

    <button class="hotspot bottom-home" onclick="goHome()"></button>
    <button class="hotspot bottom-history" onclick="goPage('history')"></button>
    <button class="hotspot bottom-fav" onclick="goPage('favorites')"></button>
    <button class="hotspot bottom-oracle" onclick="goPage('oracle')"></button>
    <button class="hotspot bottom-setting" onclick="goPage('settings')"></button>
  </div>
</section>

<section class="page" id="mode">
  <div class="screen">
    <button class="hotspot mode-upright" onclick="chooseMode('upright')"></button>
    <button class="hotspot mode-normal" onclick="chooseMode('normal')"></button>

    <button class="hotspot bottom-home" onclick="goHome()"></button>
    <button class="hotspot bottom-history" onclick="goPage('history')"></button>
    <button class="hotspot bottom-fav" onclick="goPage('favorites')"></button>
    <button class="hotspot bottom-oracle" onclick="goPage('oracle')"></button>
    <button class="hotspot bottom-setting" onclick="goPage('settings')"></button>
  </div>
</section>

<section class="page" id="focus">
  <div class="screen">
    <button class="hotspot focus-start" onclick="goPage('shuffle')"></button>
  </div>
</section>

<section class="page" id="shuffle">
  <div class="screen">
    <button class="hotspot shuffle-next" onclick="goDraw()"></button>
  </div>
</section>

<section class="page" id="draw">
  <div class="screen">
    <div class="draw-title">選擇你的牌卡</div>
    <div class="draw-count" id="drawCount"></div>
    <div class="deck-area" id="deckArea"></div>
  </div>
</section>

<section class="page" id="result">
  <div class="screen">
    <div class="result-overlay" id="resultOverlay"></div>

    <div class="result-actions">
      <button class="action-btn dark" onclick="restartSame()">↻ 重新抽牌</button>
      <button class="action-btn" onclick="saveRecord()">📷 截圖找我解牌</button>
    </div>
  </div>
</section>

<section class="page" id="oracle">
  <div class="screen">
    <button class="hotspot" style="left:5%;top:31%;width:22%;height:43%" onclick="drawOracle('soul')"></button>
    <button class="hotspot" style="left:29%;top:31%;width:20%;height:43%" onclick="drawOracle('love')"></button>
    <button class="hotspot" style="left:52%;top:31%;width:20%;height:43%" onclick="drawOracle('cosmic')"></button>
    <button class="hotspot" style="left:75%;top:31%;width:20%;height:43%" onclick="drawOracle('angel')"></button>

    <button class="hotspot bottom-home" onclick="goHome()"></button>
    <button class="hotspot bottom-history" onclick="goPage('history')"></button>
    <button class="hotspot bottom-fav" onclick="goPage('favorites')"></button>
    <button class="hotspot bottom-oracle" onclick="goPage('oracle')"></button>
    <button class="hotspot bottom-setting" onclick="goPage('settings')"></button>
  </div>
</section>

<section class="page" id="oracleAnswer">
  <div class="screen">
    <div class="oracle-answer-card" id="oracleCardBox"></div>
    <div class="oracle-answer-text" id="oracleTextBox"></div>

    <button class="hotspot" style="left:10%;top:83%;width:36%;height:8%" onclick="saveRecord()">儲存紀錄</button>
    <button class="hotspot" style="left:54%;top:83%;width:36%;height:8%" onclick="goPage('oracle')">回牌陣選擇</button>
  </div>
</section>

<section class="page simple-page" id="history">
  <div class="screen">
    <div class="simple-panel">
      <h1>抽牌紀錄</h1>
      <button class="clear-btn" onclick="clearHistory()">清除紀錄</button>
      <div id="historyList"></div>
    </div>

    <button class="hotspot bottom-home" onclick="goHome()"></button>
    <button class="hotspot bottom-fav" onclick="goPage('favorites')"></button>
    <button class="hotspot bottom-oracle" onclick="goPage('oracle')"></button>
  </div>
</section>

<section class="page simple-page" id="favorites">
  <div class="screen">
    <div class="simple-panel">
      <h1>我的收藏</h1>
      <button class="clear-btn" onclick="clearFavorites()">清除收藏</button>
      <div id="favoriteList"></div>
    </div>

    <button class="hotspot bottom-home" onclick="goHome()"></button>
    <button class="hotspot bottom-history" onclick="goPage('history')"></button>
    <button class="hotspot bottom-oracle" onclick="goPage('oracle')"></button>
  </div>
</section>

<section class="page simple-page" id="settings">
  <div class="screen">
    <div class="simple-panel">
      <h1>設定</h1>
      <div class="record-item">抽牌模式固定只有：「正位抽牌」與「正逆位抽牌」，不顯示百分比。</div>
      <div class="record-item">頁面視覺直接使用你上傳的參考圖作為底圖，讓整體更接近你要的畫面。</div>

    </div>

    <button class="hotspot bottom-home" onclick="goHome()"></button>
    <button class="hotspot bottom-history" onclick="goPage('history')"></button>
    <button class="hotspot bottom-fav" onclick="goPage('favorites')"></button>
    <button class="hotspot bottom-oracle" onclick="goPage('oracle')"></button>
  </div>
</section>

      ["B補充",""],
      ["B方向",""],
      ["淺意識",""]
    ]
  },
  spirit:{
    name:"身心靈牌陣",
    count:3,
    positions:[
      ["身","外在的行為"],
      ["心","心理的想法"],
      ["靈","淺意識的感受"]
    ]
  }
};

const modeText = {
  upright:"正位抽牌",
  normal:"正逆位抽牌"
};

const oracleCards = [
  {
    type:"soul",
    icon:"☾",
    en:"Trust the Timing",
    cn:"信任過程",
    text:"有些事情不是沒有發生，\n而是在最適合的時間靠近你。\n\n請相信，\n你沒有錯過任何屬於你的東西。\n\n宇宙正為你鋪路，\n你只需要穩住心，繼續往前。"
  },
  {
    type:"love",
    icon:"♡",
    en:"Speak Your Heart",
    cn:"真誠表達",
    text:"被理解的開始，\n是願意說出自己的感受。\n\n不要壓抑，也不要逞強，\n溫柔而清楚地說出你的心。"
  },
  {
    type:"cosmic",
    icon:"✧",
    en:"Go With the Flow",
    cn:"順流而行",
    text:"當你停止對抗，\n事情會開始自然流動。\n\n你不需要急著掌控所有答案，\n先相信當下的安排。"
  },
  {
    type:"angel",
    icon:"♁",
    en:"Blessings",
    cn:"祝福",
    text:"此刻的你已經足夠好了。\n\n願祝福在最適合的時間來到你身邊，\n也願你相信自己值得被愛與守護。"
  }
];

let stack = ["home"];
let currentSpread = null;
let currentMode = "normal";
let selected = [];
let deck = [];
let results = [];
let currentOracle = null;

function show(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function goPage(id){
  show(id);
  if(stack[stack.length - 1] !== id){
    stack.push(id);
  }
  if(id === "history") renderHistory();
  if(id === "favorites") renderFavorites();
}

function goHome(){
  stack = ["home"];
  show("home");
}

function chooseSpread(id){
  currentSpread = spreads[id];
  selected = [];
  results = [];
  goPage("mode");
}

function chooseMode(mode){
  currentMode = mode;
  goPage("focus");
}

function commonsUrl(file){
  return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file);
}

function backupUrl(code){
  return "https://www.sacred-texts.com/tarot/pkt/img/" + code + ".jpg";
}

function imgErr(img,backup){
  if(!img.dataset.backup){
    img.dataset.backup = "1";
    img.src = backupUrl(backup);
  }
}

function goDraw(){
  deck = [...tarotCards];
  selected = [];
  results = [];

  const area = document.getElementById("deckArea");
  area.innerHTML = "";
  updateCount();

  deck.forEach((card,i) => {
    const b = document.createElement("button");
    b.className = "deck-card";
    b.onclick = () => pick(i,b);
    area.appendChild(b);
  });

  goPage("draw");
}

function updateCount(){
  document.getElementById("drawCount").innerText = currentSpread
    ? `請依序抽出 ${currentSpread.count} 張牌｜已選擇 ${selected.length} / ${currentSpread.count}`
    : "";
}

function pick(i,el){
  if(selected.includes(i) || selected.length >= currentSpread.count) return;

  selected.push(i);
  el.classList.add("selected");
  updateCount();

  if(selected.length === currentSpread.count){
    document.querySelectorAll(".deck-card").forEach(c => c.classList.add("disabled"));
    setTimeout(() => {
      makeResults();
      renderResults();
      goPage("result");
    },400);
  }
}

function orientation(){
  return currentMode === "upright"
    ? "正位"
    : (Math.random() < .5 ? "正位" : "逆位");
}

function pull(){
  const i = Math.floor(Math.random() * deck.length);
  return deck.splice(i,1)[0];
}

function makeResults(){
  deck = [...tarotCards];

  results = currentSpread.positions.map(pos => ({
    position:pos[0],
    sub:pos[1],
    card:pull(),
    orientation:orientation()
  }));
}

function renderResults(){
  const box = document.getElementById("resultOverlay");

  box.innerHTML = results.map(r => `
    <div class="result-card">
      <div class="result-pos">${r.position}</div>
      ${r.sub ? `<div class="result-sub">${r.sub}</div>` : ""}
      <img
        src="${commonsUrl(r.card.commons)}"
        onerror="imgErr(this,'${r.card.backup}')"
        class="${r.orientation === "逆位" ? "reversed" : ""}"
      >
      <div class="result-name">${r.card.name}・${r.orientation}</div>
    </div>
  `).join("");
}

function restartSame(){
  if(currentSpread) goPage("shuffle");
}

function drawOracle(type){
  const pool = oracleCards.filter(o => o.type === type);
  currentOracle = pool[Math.floor(Math.random() * pool.length)];

  document.getElementById("oracleCardBox").innerHTML = `
    <div class="en">${currentOracle.en}</div>
    <div class="cn">${currentOracle.cn}</div>
    <div class="icon">${currentOracle.icon}</div>
  `;

  document.getElementById("oracleTextBox").innerHTML = `
    <div class="oracle-answer-title">神諭訊息</div>
    ${currentOracle.text.replace(/\n/g,"<br>")}
  `;

  goPage("oracleAnswer");
}

function payload(){
  return {
    date:new Date().toLocaleString("zh-TW"),
    spread:currentSpread?.name || "",
    mode:modeText[currentMode] || "",
    cards:results.map(r => ({
      position:r.position,
      sub:r.sub,
      name:r.card.name,
      orientation:r.orientation
    })),
    oracle:currentOracle
      ? {
          cn:currentOracle.cn,
          text:currentOracle.text
        }
      : null
  };
}

function saveRecord(){
  const old = JSON.parse(localStorage.getItem("soulNestRecords") || "[]");
  old.unshift(payload());
  localStorage.setItem("soulNestRecords",JSON.stringify(old.slice(0,50)));
  alert("已儲存紀錄");
}

function saveFavorite(){
  const old = JSON.parse(localStorage.getItem("soulNestFavorites") || "[]");
  old.unshift(payload());
  localStorage.setItem("soulNestFavorites",JSON.stringify(old.slice(0,50)));
  alert("已加入收藏");
}

function renderList(key,id,empty){
  const data = JSON.parse(localStorage.getItem(key) || "[]");
  const box = document.getElementById(id);

  if(!data.length){
    box.innerHTML = `<div class="record-item">${empty}</div>`;
    return;
  }

  box.innerHTML = data.map(r => `
    <div class="record-item">
      <b style="color:#F5D37A">${r.date}</b><br>
      ${r.spread}｜${r.mode}<br>
      ${(r.cards || []).map(c =>
        `${c.position}${c.sub ? `（${c.sub}）` : ""}：${c.name}・${c.orientation}`
      ).join("<br>")}
      ${r.oracle ? `<br><br>神諭卡：${r.oracle.cn}` : ""}
    </div>
  `).join("");
}

function renderHistory(){
  renderList("soulNestRecords","historyList","目前還沒有抽牌紀錄。");
}

function renderFavorites(){
  renderList("soulNestFavorites","favoriteList","目前還沒有收藏內容。");
}

function clearHistory(){
  if(confirm("確定清除紀錄嗎？")){
    localStorage.removeItem("soulNestRecords");
    renderHistory();
  }
}

function clearFavorites(){
  if(confirm("確定清除收藏嗎？")){
    localStorage.removeItem("soulNestFavorites");
    renderFavorites();
  }
}
</script>

</body>
</html>
